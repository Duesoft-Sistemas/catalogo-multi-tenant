<header class="main-header flex flex-wrap items-center navbar-expand  p-3"  style="background-color: var(--color-primary); color: var(--color-font-color-light);"
[ngClass]="this.seletorPeculiaridadesCatalogos.clientes.cliente11 || this.seletorPeculiaridadesCatalogos.clientes.cliente15 ? 'black!important' : 'text-white'">

  <!-- Left navbar links -->
  <nav class="navbar-nav flex items-center justify-center">
    <ul class="flex items-center">
      <li class="nav-item lg:hidden">
        <button 
          class="px-3 py-2 text-white hover:text-gray-200 transition-colors duration-200 no-underline" 
          data-widget="pushmenu" 
          type="button"
          aria-label="Abrir menu lateral">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
      </li>

      <li class="nav-item flex items-center flex-nowrap">
        <h1 class="title cursor-hand alinha-centro font-normal" (click)="reload()">
          {{currentTitle}}
        </h1>
      </li>
    </ul>
  </nav>

  <!-- Right navbar actions -->
  <nav class="navbar-nav ml-auto mr-2">
    <button 
      class="btn-sair cursor-pointer text-lg" 
      (click)="openModalConfirm()" 
      matTooltip="Sair"
      aria-label="Sair da aplicação"
      type="button">
      <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
    </button>
  </nav>
</header>
