<form role="form" [formGroup]="form" *ngIf="form" class="w-full max-w-4xl mx-auto p-6 bg-white rounded-lg shadow-sm">
  <!-- Header -->
  <div class="mb-6">
    <h2 class="text-2xl font-semibold text-blue-600 mb-2">Dados</h2>
    <hr class="border-gray-200">
  </div>

  <!-- Form Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Documento Type Toggle -->
    <div class="md:col-span-2 lg:col-span-3">
      <app-checkbox-model 
        [label]="'Documento'" 
        [form]="form" 
        [controlName]="'tipoDocumento'"
        [labelTrue]="'CNPJ'" 
        [labelFalse]="'CPF'">
      </app-checkbox-model>
    </div>

    <!-- Nome -->
    <div class="md:col-span-1">
      <app-input-model 
        [label]="'Nome'" 
        [form]="form" 
        [controlName]="'nome'" 
        [maxLength]="100">
      </app-input-model>
    </div>

    <!-- Razão Social -->
    <div class="md:col-span-1">
      <app-input-model 
        [label]="'Razão Social'" 
        [form]="form" 
        [controlName]="'razao'" 
        [maxLength]="100">
      </app-input-model>
    </div>

    <!-- CPF -->
    <div class="md:col-span-1" *ngIf="!this.form.get('tipoDocumento')?.value">
      <app-input-model 
        (blur)="verificaCpf()" 
        [label]="'CPF'" 
        [form]="form"
        [controlName]="'cpfCnpj'" 
        [maxLength]="14" 
        [mask]="'000.000.000-00'">
      </app-input-model>
    </div>

    <!-- CNPJ -->
    <div class="md:col-span-1" *ngIf="this.form.get('tipoDocumento')?.value">
      <app-input-model 
        (blur)="verificaCnpj()" 
        [label]="'CNPJ'" 
        [form]="form"
        [controlName]="'cpfCnpj'" 
        [maxLength]="18" 
        [mask]="'00.000.000/0000-00'">
      </app-input-model>
    </div>

    <!-- Empresa Select -->
    <div class="md:col-span-1">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Empresa <span class="text-red-500">*</span>
        </label>
        <ng-select 
          [loading]="loadListEmpresas" 
          [items]="listEmpresas" 
          bindLabel="companyName" 
          bindValue="companyId"
          placeholder="Selecione..." 
          formControlName="codEmpresa"
          class="!w-full !border-gray-300 !rounded-lg !shadow-sm focus:!border-primary focus:!ring-2 focus:!ring-blue-200">
        </ng-select>
      </div>
    </div>

    <!-- Email -->
    <div class="md:col-span-1">
      <app-input-model 
        [label]="'Email'" 
        [form]="form" 
        [controlName]="'email'" 
        [maxLength]="75">
      </app-input-model>
    </div>

    <!-- DDD -->
    <div class="md:col-span-1">
      <app-input-model 
        [label]="'DDD'" 
        [form]="form" 
        [controlName]="'numeroDddContato'"
        [mask]="'00'">
      </app-input-model>
    </div>

    <!-- Telefone -->
    <div class="md:col-span-1">
      <app-input-model 
        [label]="'Telefone'" 
        [form]="form" 
        [controlName]="'numeroFoneContato'"
        [mask]="'0000-0000||0 0000-0000'">
      </app-input-model>
    </div>
  </div>
