<div style="padding: 24px; max-width: 400px; margin: 0 auto">
  <!-- Título principal -->
  <h2
    style="
      font-size: 1.25rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
    "
  >
    {{ title }}
  </h2>

  <!-- Subtítulo (opcional) -->
  <h3 *ngIf="subTitle" style="text-align: center; margin-bottom: 24px">
    <span style="font-size: 0.875rem; color: #4b5563; font-weight: 500">{{
      subTitle
    }}</span>
  </h3>

  <!-- Botões de ação -->
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    "
  >
    <!-- Botão "Não" -->
    <button
      type="button"
      mat-raised-button
      color="warn"
      [mat-dialog-close]="false"
      style="width: 100%; padding: 8px 16px"
      aria-label="Cancelar operação"
    >
      Não
    </button>

    <!-- Botão "Sim" -->
    <button
      type="button"
      mat-raised-button
      color="primary"
      [mat-dialog-close]="true"
      style="width: 100%; padding: 8px 16px"
      aria-label="Confirmar operação"
    >
      Sim
    </button>
  </div>
</div>
