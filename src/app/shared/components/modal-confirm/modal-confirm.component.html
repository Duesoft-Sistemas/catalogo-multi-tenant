<div class="w-full p-6 max-w-lg mx-auto">
  <!-- Título principal -->
  <h2 class="text-xl font-bold text-gray-800 text-center mb-3 leading-tight">
    {{title}}
  </h2>
  
  <!-- Subtítulo (opcional) -->
  <h3 *ngIf="subTitle" class="text-center mb-6">
    <span class="text-sm sm:text-base text-gray-600 font-medium">{{subTitle}}</span>
  </h3>
  
  <!-- Botões de ação -->
  <div class="w-full flex justify-between items-center sm:flex-row gap-3 sm:gap-4 ">
    <!-- Botão "Não" -->
    <button 
      type="button" 
      class="w-full px-6 py-3 text-sm sm:text-base font-medium text-white bg-red-500 hover:bg-red-600 rounded-lg transition-all duration-200"
      [mat-dialog-close]="false"
      aria-label="Cancelar operação">
      Não
    </button>
    
    <!-- Botão "Sim" -->
    <button 
      type="button" 
      class="w-full px-6 py-3 text-sm sm:text-base font-medium text-white bg-primary hover:bg-primary-dark rounded-lg transition-all duration-200"
      [mat-dialog-close]="true"
      aria-label="Confirmar operação">
      Sim
    </button>
  </div>
</div>
