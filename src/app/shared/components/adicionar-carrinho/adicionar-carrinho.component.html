<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <!-- Modal Content -->
  <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-4 relative">
    <!-- Close Button -->
    <button 
      (click)="dialogRef.close()" 
      class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors duration-200"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <!-- Header -->
    <div class="mb-6">
      <h2 class="text-xl font-bold text-gray-800">Adicionar Produto</h2>
    </div>

    <!-- Product Info Row -->
    <div class="flex items-end gap-4 mb-6 justify-center mt-2">
      <!-- Product Image -->
      <div class="w-16 h-16 bg-gray-100 rounded-lg flex items-center justify-center flex-shrink-0 overflow-hidden">
        <img 
          [src]="!produto.imageSafe || produto.image?.includes('./static/') ? imgPadraoProduto : produto.imageSafe"
          [alt]="produto.description"
          class="w-full h-full object-cover rounded-lg"
        >
      </div>

      <!-- Product Details -->
      <div class="flex-1">
        <p class="text-xs uppercase text-gray-500 font-medium mb-1">Código: {{produto.code}}</p>
        <p class="text-gray-800 font-medium text-sm leading-tight">Descrição: {{produto.description}}</p>
      </div>
    </div>

    <!-- Quantity Selector -->
    <div class="mb-4 flex flex-col gap-4 justify-center items-end">
      <form [formGroup]="formulario" *ngIf="formulario">
        <!-- Unit Selection (if available) -->
        <div class="mb-4" *ngIf="produto.unity2 != null && produto.unity2 != ''">
          <label class="block text-sm font-medium text-gray-700 mb-2">Unidade</label>
          <select 
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-primary outline-none"
            [(ngModel)]="produto.unidadeEscolhida"
            [ngModelOptions]="{standalone: true}"
            (change)="onUnidadeChange($event)"
          >
            <option [value]="produto.unity">{{produto.unity}}</option>
            <option [value]="produto.unity2">{{produto.unity2}}</option>
          </select>
        </div>

        <!-- Quantity Controls -->
        <div class="flex items-center justify-center gap-4">
          <button
            type="button"
            (click)="diminuiQuantidade()"
            [disabled]="habilitaDesabilitaDiminui()"
            class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
            </svg>
          </button>

          <input
            type="number"
            [formControlName]="'quantidade'"
            (blur)="verificaQuantidade()"
            min="1"
            [max]="produto.stock"
            class="w-16 text-center border border-gray-300 rounded-lg py-1 focus:ring-2 focus:ring-primary focus:border-primary outline-none"
          >

          <button
            type="button"
            (click)="aumentaQuantidade()"
            [disabled]="habilitaDesabilitaAumenta()"
            class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
          </button>
        </div>

        <!-- Availability Label -->
        <p class="text-center text-xs text-gray-500 mt-2">Disponível: {{produto.stock}}</p>
      </form>
    </div>

    <!-- Total Price Row -->
    <div class="border-t pt-4 mb-6 px-2">
      <div class="flex justify-between items-center">
        <span class="font-bold text-gray-800">Total</span>
        <span class="font-bold text-primary text-lg">
          <span *ngIf="produto.unidadeEscolhida == produto.unity">
            {{(convertToNumber(produto.price) * formulario.get('quantidade').value) | currency}}
          </span>
          <span *ngIf="produto.unidadeEscolhida == produto.unity2">
            {{(convertToNumber(produto.price2) * formulario.get('quantidade').value) | currency}}
          </span>
        </span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-3">
              <button
          (click)="addCarrinho()"
          class="flex-1 bg-primary text-white font-bold py-3 px-4 rounded-full hover:bg-primary-light transition-colors duration-200"
        >
          Confirmar
        </button>
      <button
        (click)="dialogRef.close()"
        class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 px-4 rounded-full hover:bg-gray-300 transition-colors duration-200"
      >
        Cancelar
      </button>
    </div>
  </div>
</div>
