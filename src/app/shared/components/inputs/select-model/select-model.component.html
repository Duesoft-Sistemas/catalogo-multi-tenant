<form [formGroup]="form" *ngIf="form" class="w-full">
  <div [class]="formularios.getRequired(form, controlName)" class="mb-4">
    <label *ngIf="label" class="block text-sm font-medium text-gray-700 mb-2" [for]="'txt'+label"> 
      {{label}} 
    </label>
    <ng-select 
      [items]="list"  
      [bindLabel]="bindLabel??'nome'" 
      [bindValue]="bindValue??'codigo'" 
      [formControlName]="controlName"
      class="w-full border border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-colors duration-200"
      [ngClass]="{'border-red-500 ring-2 ring-red-200': formularios.validTouched(form.get(controlName))}" 
      (change)="change.emit($event)"
      [addTag]="addTagPromise??false" 
      [loading]="loading??false" 
      [multiple]="multiple??false" 
      [closeOnSelect]="multiple?false : true"
      [matTooltip]="formularios.validTouched(form.get(controlName)) ? formularios.msgErroCustom(form.get(controlName)) : ''"
      #tooltip="matTooltip" 
      (focus)="tooltip.show()" 
      matTooltipClass="tooltip-red" 
      [matTooltipPosition]="'below'">
    </ng-select>
  </div>
</form>
