<form [formGroup]="form" *ngIf="form" class="w-full">
  <div [class]="formularios.getRequired(form, controlName)" class="mb-4">
    <label 
      class="block text-sm font-medium text-gray-700 mb-2" 
      [for]="'txt' + label"> 
      {{ label }} 
    </label>
    <input
      [type]="type ? type : 'text'"
      [name]="'txt' + label"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
      [ngClass]="{
        'border-red-500 ring-2 ring-red-200': formularios.validTouched(form.get(controlName))
      }"
      [formControlName]="controlName"
      [minlength]="minLength ? minLength : ''"
      [maxlength]="maxLength ? maxLength : ''"
      (blur)="blur.emit(form.get(controlName).value)"
      [matTooltip]="
        formularios.validTouched(form.get(controlName))
          ? formularios.msgErroCustom(form.get(controlName))
          : ''
      "
      matTooltipClass="tooltip-red"
      [matTooltipPosition]="'below'"
      #tooltip="matTooltip"
      (focus)="tooltip.show()"
      [mask]="mask ?? ''"
    />
  </div>
</form>
