<aside
  class="main-sidebar sidebar-dark-primary elevation-4 transition-all duration-300 pt-2"
  [ngClass]="{ 
    '!w-[4.6rem]': sidebarColapsada && !isMobile, 
    '!w-64': !sidebarColapsada || isMobile 
  }"
  (mouseenter)="!isMobile && (sidebarColapsada = false)"
  (mouseleave)="!isMobile && (sidebarColapsada = true)"
  role="complementary"
  aria-label="Menu de navegação"
>

  <!-- Brand/Logo Section -->
  <header class="!h-[58px] flex items-center px-3 py-2">
    <a routerLink="inicio" routerLinkActive="active" class="flex items-center flex-shrink-0">
      <img
        [src]="'../../../assets/images/' + seletorPeculiaridadesCatalogos.logoSidebar"
        alt="Logo da empresa"
        class="!max-h-8 w-auto rounded-full flex-shrink-0"
        [ngStyle]="{ 'background-color': getColor(), 'opacity': getOpacidade() }"
      />
      <span
        *ngIf="nomeEmpresa"
        class="!text-white !text-md uppercase !font-bold overflow-hidden transition-all duration-300"
        [ngClass]="{
          'opacity-0 w-0 invisible': sidebarColapsada && !isMobile,
          'opacity-100 w-auto visible ml-3': !sidebarColapsada || isMobile,
          'whitespace-nowrap': !isMobile,
          'whitespace-normal max-w-40': isMobile
        }"
      >
        {{ nomeEmpresa }}
      </span>
    </a>
  </header>

  <!-- Navigation Menu -->
  <nav class="!w-full !p-2 overflow-y-auto h-full" role="navigation">
    <ul
      class="w-full flex flex-col gap-2"
      [ngClass]="{
        'items-center': sidebarColapsada && !isMobile,
        'items-start': !sidebarColapsada || isMobile
      }"
    >
      <li *ngFor="let item of menuItems" class="w-full">
        <a
          [routerLink]="item.link"
          routerLinkActive="active"
          (click)="escondeMenu()"
          class="w-full flex px-4 py-3 min-h-[50px] rounded text-white cursor-pointer transition-all items-center"
          [ngClass]="{
            'bg-gray-700': router.isActive(item.link, { paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }),
            'hover:bg-gray-700': true,
            'justify-center': sidebarColapsada && !isMobile,
            'justify-start': !sidebarColapsada || isMobile
          }"
          [attr.aria-label]="item.label"
        >
          <i [class]="item.icon + ' text-lg w-6 min-w-6 text-center flex-shrink-0'" aria-hidden="true"></i>
          <span
            class="whitespace-nowrap overflow-hidden transition-all duration-300 flex-shrink-0"
            [ngClass]="{
              'opacity-0 w-0 invisible': sidebarColapsada && !isMobile,
              'opacity-100 w-auto visible ml-3': !sidebarColapsada || isMobile
            }"
          >
            {{ item.label }}
          </span>
        </a>
      </li>

      <!-- Alterar Senha -->
      <li class="w-full">
        <button
          (click)="openModalAlterarSenha()"
          class="w-full flex px-4 py-3 min-h-[50px] rounded hover:bg-gray-700 text-white cursor-pointer transition-all items-center"
          [ngClass]="{
            'justify-center': sidebarColapsada && !isMobile,
            'justify-start': !sidebarColapsada || isMobile
          }"
          type="button"
          aria-label="Alterar senha"
        >
          <i class="fas fa-users-cog text-lg w-6 min-w-6 text-center flex-shrink-0" aria-hidden="true"></i>
          <span
            class="whitespace-nowrap overflow-hidden transition-all duration-300 flex-shrink-0"
            [ngClass]="{
              'opacity-0 w-0 invisible': sidebarColapsada && !isMobile,
              'opacity-100 w-auto visible ml-3': !sidebarColapsada || isMobile
            }"
          >
            Alterar Senha
          </span>
        </button>
      </li>

    </ul>
  </nav>
</aside>
