<div class="content-wrapper">
  <app-spinner [show]="spinner"></app-spinner>
 
  <div class="content !p-2 !pb-4">
    <div class="container-fluid !px-4">
      
      <!-- CABEÇALHO -->
      <div class="content-header !py-4 !-ml-2 !my-2">

        <!-- CONTADOR DE PRODUTOS -->
        <div class="flex justify-end items-center" *ngIf="showProductCount && productCount !== undefined">
          <div class="!bg-gray-100 !border !border-gray-300 !text-gray-700 !px-4 !py-2 !rounded-lg !flex !items-center !gap-2 !text-sm !font-medium">
            <i class="fas fa-boxes !text-primary"></i>
            <span>{{ productCount }} produto{{ productCount !== 1 ? 's' : '' }}</span>
          </div>
        </div>
        
        <!-- CONTEÚDO DO CABEÇALHO: Slot para conteúdo customizado -->
        <ng-content select="[header]"></ng-content>
      </div>
      
      <!-- CORPO DA PÁGINA -->
      <div class="content-body !p-0 " *ngIf="showContentBody">
        <!-- CARD PRINCIPAL -->
        <div class="card !overflow-hidden !min-h-[calc(100vh-200px)]">
          
          <!-- FILTROS: Slot para filtros -->
          <ng-content select="[filter]"></ng-content>
          
          <!-- CORPO DO CARD -->
        
            <ng-content select="[body]"></ng-content>
        
          
          <!-- RODAPÉ DO CARD -->
          <div class="card-footer !px-8 !py-6 !bg-gradient-to-r !from-gray-50 !to-gray-100 !border-t !border-gray-200 !rounded-b-xl" *ngIf="showFooter">
            <ng-content select="[footer]"></ng-content>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
