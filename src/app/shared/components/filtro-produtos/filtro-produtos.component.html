<div class="bg-white rounded-lg shadow-lg max-w-sm w-full">
  <!-- Header simples -->
  <div class="bg-gray-100 px-6 py-4 border-b border-gray-200">
    <h2 class="text-lg font-medium text-gray-800">Pesquisar Produtos</h2>
    
    <!-- Botão fechar simples -->
    <button
      type="button"
      class="absolute text-2xl top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
      mat-dialog-close
    >
      <span class="text-2xl">&times;</span>
    </button>
  </div>

  <!-- Conteúdo do formulário -->
  <div class="p-6">
    <form [formGroup]="formulario" *ngIf="formulario">
      <div class="mb-4">
        <label 
          for="inputFiltrar" 
          class="block text-sm font-medium text-gray-700 mb-2"
        >
          Código / Fábrica / Original / Similar / Descrição
        </label>
        
        <input
          type="text"
          id="inputFiltrar"
          name="selCode"
          formControlName="code"
          placeholder="..."
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
        />
      </div>
    </form>
  </div>

  <!-- Ações -->
  <div class="bg-gray-100 px-6 py-4 flex justify-center">
    <button
      type="button"
      (click)="buscar()"
      class="px-6 py-2 bg-primary text-white rounded-xl hover:bg-primary-dark duration-200 shadow-sm"
    >
      Buscar
    </button>
  </div>
</div>
