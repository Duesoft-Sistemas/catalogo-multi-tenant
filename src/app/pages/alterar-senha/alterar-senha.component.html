<app-spinner [show]="spinner"></app-spinner>

<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 relative">
    <!-- Close Button -->
    <button 
      mat-dialog-close 
      class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors duration-200"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <!-- Title -->
    <h2 class="text-lg font-bold text-gray-700 mb-4 flex items-center justify-center">Alteração de Senha</h2>

    <!-- Form -->
    <form [formGroup]="formulario" *ngIf="formulario" class="space-y-4">
      <!-- Current Password -->
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-2">
          Senha Atual
        </label>
        <input
          type="password"
          placeholder="********"
          formControlName="oldPassword"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all duration-200"
          [class.border-red-500]="validaErrorSenhas('oldPassword')"
          [class.focus:ring-red-500]="validaErrorSenhas('oldPassword')"
          [class.focus:border-red-500]="validaErrorSenhas('oldPassword')"
        />
        <div *ngIf="validaErrorSenhas('oldPassword')" class="text-red-500 text-xs mt-1">
          Senha atual é obrigatória
        </div>
      </div>

      <!-- New Password -->
      <div>
        <label class="block text-xs font-bold text-font-color uppercase tracking-wide mb-2">
          Nova Senha
        </label>
        <input
          type="password"
          placeholder="********"
          formControlName="newPassword"
          (blur)="verificaSenhasIguais()"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all duration-200"
          [class.border-red-500]="validaErrorSenhas('newPassword')"
          [class.focus:ring-red-500]="validaErrorSenhas('newPassword')"
          [class.focus:border-red-500]="validaErrorSenhas('newPassword')"
        />
        <div *ngIf="validaErrorSenhas('newPassword')" class="text-red-500 text-xs mt-1">
          <span *ngIf="formulario.get('newPassword')?.errors?.['required']">Nova senha é obrigatória</span>
          <span *ngIf="formulario.get('newPassword')?.errors?.['senhasDiferentes']">As senhas não coincidem</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-xs font-bold text-font-color uppercase tracking-wide mb-2">
          Confirmar Nova Senha
        </label>
        <input
          type="password"
          placeholder="********"
          formControlName="confirmNewPassword"
          (blur)="verificaSenhasIguais()"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all duration-200"
          [class.border-red-500]="validaErrorSenhas('confirmNewPassword')"
          [class.focus:ring-red-500]="validaErrorSenhas('confirmNewPassword')"
          [class.focus:border-red-500]="validaErrorSenhas('confirmNewPassword')"
        />
        <div *ngIf="validaErrorSenhas('confirmNewPassword')" class="text-red-500 text-xs mt-1">
          <span *ngIf="formulario.get('confirmNewPassword')?.errors?.['required']">Confirmação de senha é obrigatória</span>
          <span *ngIf="formulario.get('confirmNewPassword')?.errors?.['senhasDiferentes']">As senhas não coincidem</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3 pt-4">
        <button
          type="button"
          (click)="alterar()"
          [disabled]="spinner"
          class="flex-1 bg-primary text-white font-bold py-2 px-4 rounded-lg hover:bg-primary disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
        >
          <span *ngIf="!spinner">Alterar</span>
          <span *ngIf="spinner">Alterando...</span>
        </button>
        <button
          type="button"
          mat-dialog-close
          class="flex-1 bg-white text-black font-bold py-2 px-4 rounded-lg border border-black"
        >
          Fechar
        </button>
      </div>
    </form>
  </div>
</div>
