<div class="min-h-screen flex justify-center items-center px-4" *ngIf="!autenticado">
  <app-spinner [show]="spinner"></app-spinner>

  <div class="w-full max-w-md bg-white rounded-lg shadow-lg relative">
    <div class="p-6 border-b border-gray-200">
      <div class="text-center">
        <div class="w-full flex justify-center">
          <img class="max-w-[200px] max-h-[124px] mx-2.5 mb-2.5" [src]='"../../../assets/images/"+this.seletorPeculiaridadesCatalogos.logoLogin+""' alt="Logo">
        </div>

        <b class="text-lg text-gray-800">
          <p *ngIf="!this.seletorPeculiaridadesCatalogos.clientes.cliente13">Catálogo </p>{{this.seletorPeculiaridadesCatalogos.nomeCatalogo}}
        </b>
      </div>
    </div>

    <div class="p-6">
      <p class="text-center text-gray-600 mb-6">Faça login para iniciar sua sessão</p>

      <form [formGroup]="formulario" role="form">
        <div class="space-y-4">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">CPF/CNPJ</label>

            <div class="relative">
              <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" placeholder="CPF/CNPJ" formControlName="user" mask="CPF_CNPJ">

              <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                <div class="text-gray-400">
                  <i class="fas fa-id-card-alt"></i>
                </div>
              </div>
            </div>
          </div>
          
          <div class="space-y-2" *ngIf="cnpjValido">
            <label class="block text-sm font-medium text-gray-700 mb-1">Empresa</label>
            <ng-select [items]="listEmpresas" bindLabel="companyName" bindValue="companyCnpj" placeholder="Selecione..." formControlName="company" class="max-w-[270px]"></ng-select>
          </div>
          
          <div class="space-y-2" *ngIf="cnpjValido">
            <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>

            <div class="relative">
              <input type="password" formControlName="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" placeholder="Senha" autocomplete="on" (keyup.enter)="efetuarLogin()">

              <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                <div class="text-gray-400">
                  <span class="fas fa-lock"></span>
                </div>
              </div>
            </div>
          </div>
          
          <div class="flex justify-end space-x-2 mt-4">
            <button (click)="validarCnpj()" type="button" class="!bg-primary !border-primary hover:!bg-primary-dark hover:!border-primary-dark !text-white px-4 py-2 rounded-md shadow-md transition-colors duration-200 font-medium" [ngClass]="this.seletorPeculiaridadesCatalogos.clientes.cliente11 || this.seletorPeculiaridadesCatalogos.clientes.cliente15 ? '!text-black' : '!text-white'">
              Buscar &nbsp; <i class="fas fa-search"></i>
            </button>

            <button (click)="efetuarLogin()" type="button" class="!bg-primary !border-primary hover:!bg-primary-dark hover:!border-primary-dark !text-white px-4 py-2 rounded-md shadow-md transition-colors duration-200 font-medium" [ngClass]="this.seletorPeculiaridadesCatalogos.clientes.cliente11 || this.seletorPeculiaridadesCatalogos.clientes.cliente15 ? '!text-black' : '!text-white'" *ngIf="cnpjValido">
              Entrar &nbsp;<i class="fas fa-sign-in-alt"></i>
            </button>
          </div>
          
          <div class="flex justify-between mt-6">
            <a class="text-gray-500 hover:text-primary cursor-pointer transition-colors duration-200" (click)="openModalCadastrarse()">Cadastrar-se</a>
            
            <a class="text-gray-500 hover:text-primary cursor-pointer transition-colors duration-200" (click)="validarCnpj(true)">Recuperar senha</a>
          </div>
        </div>
      </form>
    </div>
    
    <div class="absolute left-1/2 transform -translate-x-1/2 -bottom-6 text-center text-sm text-gray-600 w-full">
      <a href="https://www.duesoft.com.br/" class="hover:text-primary transition-colors duration-200">
        <p>Desenvolvido por <span class="font-bold">Duesoft Sistemas</span></p>
      </a>
    </div>
  </div>
</div>
