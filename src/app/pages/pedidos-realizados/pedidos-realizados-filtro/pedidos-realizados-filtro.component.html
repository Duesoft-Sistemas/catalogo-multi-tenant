<div class="!p-6 !max-w-md w-full">
  <mat-card-header class="!pb-4">
    <mat-card-title class="!text-xl !font-semibold !text-gray-800 !flex !items-center !gap-2">
      <i class="fas fa-search text-primary"></i>
      Pesquisar Pedidos
    </mat-card-title>
  </mat-card-header>

  <mat-divider class=""></mat-divider>

  <mat-card-content class="!pb-6">
    <form [formGroup]="formulario" *ngIf="formulario" class="space-y-5">
      <!-- Data Inicial -->
      <div class="space-y-2">
        <label for="initialDate" class="!block !text-sm !font-medium !text-gray-700 !mb-1">
          <i class="far fa-calendar-alt text-primary !mr-1"></i>
          Data Inicial
        </label>

        <div class="!relative">
          <div class="!absolute !inset-y-0 !left-0 !pl-3 !flex !items-center !pointer-events-none">
            <span class="!text-gray-400">
              <i class="far fa-calendar-alt"></i>
            </span>
          </div>

          <input
            type="text"
            placeholder="DD/MM/AAAA"
            class="!block !w-full !pl-10 !pr-3 !py-3 !border !border-gray-300 !rounded-lg !focus:ring-2 !focus:ring-primary !focus:border-primary !transition-all !duration-200 !bg-white !text-gray-900 !placeholder-gray-400 !shadow-sm"
            bsDatepicker
            maxlength="10"
            formControlName="initialDate"
          />
        </div>
      </div>

      <!-- Data Final -->
      <div class="space-y-2">
        <label for="finalDate" class="!block !text-sm !font-medium !text-gray-700 !mb-1">
          <i class="far fa-calendar-alt text-primary !mr-1"></i>
          Data Final
        </label>

        <div class="!relative">
          <div class="!absolute !inset-y-0 !left-0 !pl-3 !flex !items-center !pointer-events-none">
            <span class="!text-gray-400">
              <i class="far fa-calendar-alt"></i>
            </span>
          </div>

          <input
            type="text"
            placeholder="DD/MM/AAAA"
            class="!block !w-full !pl-10 !pr-3 !py-3 !border !border-gray-300 !rounded-lg !focus:ring-2 !focus:ring-primary !focus:border-primary !transition-all !duration-200 !bg-white !text-gray-900 !placeholder-gray-400 !shadow-sm"
            bsDatepicker
            maxlength="10"
            formControlName="finalDate"
          />
        </div>
      </div>

      <!-- Status -->
      <div class="space-y-2">
        <label for="sel" class="!block !text-sm !font-medium !text-gray-700 !mb-1">
          <i class="fas fa-tags text-primary !mr-1"></i>
          Status
        </label>

        <ng-select
          [items]="listStatus"
          [loading]="loadListStatus"
          [multiple]="true"
          bindLabel="description"
          bindValue="description"
          formControlName="status"
          placeholder="Selecione os status..."
          class="!w-full"
        >
          <ng-template ng-option-tmp let-item="item">
            <span class="!flex !items-center !gap-2">
              <i class="fas fa-circle !text-xs" [style.color]="getStatusColor(item)"></i>
              {{ item.description }}
            </span>
          </ng-template>
        </ng-select>
      </div>
    </form>
  </mat-card-content>
  
  <mat-card-actions class="w-full !flex !justify-center !items-center !gap-3 !pt-4 !border-t !border-gray-200">
    <button
      type="button"
      class="btn-primary flex-1 !px-3 !py-2 !bg-primary !text-white !font-medium !rounded-lg !focus:ring-4 !focus:ring-primary !transition-all !duration-200 !shadow-sm !flex !items-center !justify-center !gap-2"
      (click)="buscar()"
    >
      Buscar
    </button>

    <button 
      type="button"
      class="!flex-1 !px-3 !py-2 !bg-gray-500 !text-white !font-medium !rounded-lg !hover:bg-gray-600 !focus:ring-4 !focus:ring-gray-200 !transition-all !duration-200 !shadow-sm !flex !items-center !justify-center !gap-2"
      (click)="limpar()"
    >
      Limpar
    </button>

    <button 
      type="button"
      mat-dialog-close
      class="!flex-1 !px-3 !py-2 !bg-red-500 !text-white !font-medium !rounded-lg !hover:bg-red-600 !focus:ring-4 !focus:ring-red-200 !transition-all !duration-200 !shadow-sm !flex !items-center !justify-center !gap-2"
    >
      Fechar
    </button>
  </mat-card-actions>
</div>
