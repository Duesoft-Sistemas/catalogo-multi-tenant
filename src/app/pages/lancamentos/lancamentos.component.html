<app-body-page [spinner]="spinner" [schema]="schema" [productCount]="listProdutos.length" [showProductCount]="false">
  <div body *ngIf="listProdutos.length > 0">
    <app-lista-produtos
      [listProdutos]="listProdutos"
      [totalPaginas]="totalPaginas"
      [enableSearch]="true"
      (pageChanged)="goTo($event)"
      (searchChanged)="onSearchChanged($event)"
      (productsUpdated)="onProductsUpdated($event)"
      (noProductsFound)="onNoProductsFound($event)"
      (reloadCatalog)="reloadCatalog()"
    ></app-lista-produtos>
  </div>

  <!-- SEÇÃO DE ESTADO VAZIO: Quando não há produtos de lançamento -->
  <div body *ngIf="listProdutos.length === 0 && !spinner" class="!flex !items-center !justify-center !min-h-[400px] !px-4 empty-state-container">
    <div class="!max-w-md !w-full !border !border-primary !text-primary !px-6 !py-8 !rounded-xl !shadow-lg !text-center !relative !overflow-hidden empty-state-card">
      <!-- Ícone decorativo -->
      <div class="!absolute !top-0 !left-0 !w-full !h-1 !bg-gradient-to-r !from-primary !to-primary-light"></div>
      
      <!-- Ícone principal -->
      <div class="!mb-4 !flex !justify-center">
        <div class="!w-16 !h-16 !bg-transparent !rounded-full !flex !items-center !justify-center !border-2 !border-primary empty-state-icon">
          <i class="fas fa-rocket !text-2xl !text-primary"></i>
        </div>
      </div>
      
      <!-- Título -->
      <h3 class="!text-lg !font-semibold !text-primary-dark !mb-2">Nenhum Lançamento Encontrado</h3>
      
      <!-- Mensagem -->
      <p class="!text-primary !text-sm !leading-relaxed">
        No momento não há produtos de lançamento disponíveis. 
        Fique atento às nossas novidades que chegam em breve!
      </p>
      
      <!-- Ícone de informação -->
      <div class="!mt-4 !flex !items-center !justify-center !gap-2 !text-primary">
        <i class="fas fa-info-circle !text-sm"></i>
        <span class="!text-xs !font-medium">Novos produtos adicionados regularmente</span>
      </div>
    </div>
  </div>
</app-body-page>
