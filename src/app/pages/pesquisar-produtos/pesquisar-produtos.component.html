<!-- SEÇÃO PRINCIPAL: Container da página com spinner e schema -->
<app-body-page [spinner]="spinner" [schema]="schema" [productCount]="listProdutos.length" [showProductCount]="false">
  <!-- SEÇÃO DO CORPO: Lista de produtos (só aparece se houver produtos) -->
  <div body *ngIf="listProdutos.length > 0">
    <!-- COMPONENTE: Lista de produtos com paginação -->
    <app-lista-produtos
      [listProdutos]="listProdutos"
      [totalPaginas]="totalPaginas"
      [currentPageInput]="modelo.page"
      [enableSearch]="true"
      (pageChanged)="goTo($event)"
      (searchChanged)="onSearchChanged($event)"
      (productsUpdated)="onProductsUpdated($event)"
      (noProductsFound)="onNoProductsFound($event)"
      (reloadCatalog)="reloadCatalog()"
    ></app-lista-produtos>
  </div>
</app-body-page>

<!-- SEÇÃO DOS BOTÕES FLUTUANTES: Botões de ação fixos na tela -->
<div class="!fixed !bottom-10 !right-6 max-sm:!bottom-3 max-sm:!right-4">
